# Publishes a browsable preview of every pull request, so a change can be looked
# at on a phone before it is merged. Closes #179.
#
# The preview is committed to master under previews/pr-<number>/ and therefore
# served by the existing GitHub Pages site at
#   https://apolithomata.com/previews/pr-<number>/
# There is one Pages site per repository and this repository's is production, so
# publishing inside it is what makes this work with no second repository, no
# third-party host, and no account or secret to configure. GITHUB_TOKEN is issued
# by Actions itself.
#
# Media (images/, audio/, journal/media/ — about 2.4 GB) is not copied; the
# preview points at the production site for it. See pyscripts/build_preview.py.
# A pull request that changes photographs will therefore show the old ones.
#
# Previews are deleted from master when the pull request closes.

name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

# One deploy at a time: every run commits to master, and two runs racing would
# reject each other's push.
concurrency:
  group: pr-preview
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Forks get a read-only token, so the push would fail. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW: pr-${{ github.event.number }}
      URL: https://apolithomata.com/previews/pr-${{ github.event.number }}/

    steps:
      - name: Check out the pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: '3.12'

      - name: Install the generator's dependencies
        if: github.event.action != 'closed'
        run: pip install -r pr/pyscripts/requirements.txt

      - name: Build the site
        if: github.event.action != 'closed'
        working-directory: pr
        # Built rather than trusting the committed output, so the preview shows
        # what the branch's templates and data actually produce.
        run: python -m pyscripts.site_generator.generate_site

      - name: Assemble the preview
        if: github.event.action != 'closed'
        working-directory: pr
        run: python pyscripts/build_preview.py --name "$PREVIEW"

      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Publish the preview
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "previews/$PREVIEW"
          if [ "${{ github.event.action }}" != "closed" ]; then
            mkdir -p previews
            cp -r "../pr/previews/$PREVIEW" "previews/$PREVIEW"
            MESSAGE="Publish preview for #${{ github.event.number }}"
          else
            MESSAGE="Remove preview for #${{ github.event.number }}"
          fi

          git add -A previews
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "$MESSAGE"

          # Another preview may have landed while this one was building.
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin master; then
              exit 0
            fi
            echo "Push rejected, retrying ($attempt)."
            sleep $((attempt * 5))
          done
          echo "Could not publish the preview." >&2
          exit 1

      - name: Comment the preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.URL;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n**Preview:** ${url}\n\n` +
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. ` +
              `Pages takes a minute or so to pick it up.\n\n` +
              `Photographs and audio are served from the live site, not from this ` +
              `branch, so image-only changes will not show here.`;

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
