# Deploys every pull request to Cloudflare Pages and comments the URL. Closes #179.
#
# The link in the comment goes straight to a running copy of the branch — no
# machine to start, nothing to wait for, nothing to click through. It stays up,
# so it can be bookmarked, shared, or opened tomorrow.
#
# Production is not touched. apolithomata.com is published by deploy.yml from
# master, which is the Cloudflare project's production branch; a pull request
# deploys under its own branch name and so can only ever be a preview.
#
# The site is generated here rather than taken from the checkout, the same way
# deploy.yml generates it, so the preview is what merging would publish.

name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

# One deployment per pull request at a time; a newer push makes an older upload
# pointless.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

# The variety-tts release the Cypriot voice and its matching code come from.
# Bump together with the pin in pyscripts/requirements-tts.txt.
env:
  VARIETY_TTS_TAG: cypriot-voice-v1

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Pull requests from forks get no secrets, so the deploy would fail on an
    # empty API token. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # fetch-depth/filter: see deploy.yml — the sitemap needs the commit history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyscripts/requirements.txt
            pyscripts/requirements-tts.txt

      # The Cypriot narration is synthesized here, not committed. The voice is a
      # CPU ONNX model (Piper/VITS) trained in the variety-tts repo and published
      # as a release asset there: 61 MB of binary that would otherwise land in
      # this history again on every rewording. Cached by tag, so this downloads
      # once and is a no-op thereafter.
      - name: Restore the Cypriot voice
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/variety-tts
          key: cypriot-voice-${{ env.VARIETY_TTS_TAG }}

      # variety-tts is private, so the release asset has no anonymous download URL
      # to curl — it has to be fetched through the API with a token.
      - name: Download the Cypriot voice
        if: steps.voice-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.VARIETY_TTS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/variety-tts
          gh release download "$VARIETY_TTS_TAG" \
            --repo tsioftas/variety-tts \
            --pattern 'cypriot.onnx*' \
            --dir ~/.cache/variety-tts

      # Synthesis reuses whatever was built before: the manifest records a sha1
      # per paragraph, so only paragraphs whose wording actually changed are
      # re-synthesized. A cold cache costs ~3 minutes for all of them; a warm one
      # costs seconds. github.sha in the key makes every run save a fresh entry,
      # and the prefix restores the most recent one.
      - name: Restore the previously synthesized narration
        uses: actions/cache/restore@v4
        with:
          path: audio/cyp
          key: cyp-audio-v1-${{ github.sha }}
          restore-keys: cyp-audio-v1-

      - name: Generate the site
        env:
          # generate_cyp_audio.py runs under the variety-tts venv locally; here
          # everything is installed into the one CI environment, so point it at
          # this interpreter and at the downloaded voice.
          VARIETY_TTS_PYTHON: python
          VARIETY_TTS_MODEL: ~/.cache/variety-tts/cypriot.onnx
          VARIETY_TTS_TOKEN: ${{ secrets.VARIETY_TTS_TOKEN }}
        run: |
          # requirements-tts.txt names variety-tts by its plain https URL, which
          # is private and so unclonable anonymously. Rewriting the credentials
          # here keeps the token out of the requirements file and out of pip's
          # output, rather than embedding it in the URL.
          git config --global \
            url."https://x-access-token:${VARIETY_TTS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          pip install -r pyscripts/requirements.txt -r pyscripts/requirements-tts.txt
          git config --global --unset-all url."https://x-access-token:${VARIETY_TTS_TOKEN}@github.com/".insteadOf
          python -m pyscripts.site_generator.generate_site

      # generate_cyp_audio is best-effort by design: a missing voice or a failed
      # synthesis logs a warning and lets the build continue. Since the audio is
      # no longer committed, that would ship a cyp player with nothing to play.
      # Assert instead that every authored paragraph came out with audio for its
      # current wording.
      - name: Check the Cypriot narration is current
        run: python -m pyscripts.tts_audio.check_cyp_audio

      - name: Save the synthesized narration
        uses: actions/cache/save@v4
        with:
          path: audio/cyp
          key: cyp-audio-v1-${{ github.sha }}

      - name: Assemble what gets served
        run: |
          set -euo pipefail
          # Everything the site is made of, and nothing that builds it. Excluding
          # .git matters: it is 3.2 GB, larger than the site itself.
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.devcontainer' \
            --exclude '.vscode' \
            --exclude 'pyscripts' \
            --exclude 'dist' \
            ./ dist/

          # A preview is a copy of pages that also exist at apolithomata.com.
          # Keep it out of search results so it cannot compete with them. Only
          # Cloudflare reads this file, which is why it is written here rather
          # than committed.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist/_headers

          echo "Deploying $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)."

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch names the preview. Cloudflare also publishes a stable alias
          # per branch, so the deployment URL below changes each push while the
          # alias does not.
          command: >-
            pages deploy dist
            --project-name=apolithomata
            --branch=${{ github.event.pull_request.head.ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            if (!url) {
              core.warning('Cloudflare returned no deployment URL; not commenting.');
              return;
            }

            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              `### [▶ Preview this pull request](${url})`,
              '',
              `Built from \`${sha}\`. Updated on every push.`,
              '',
              'This is the branch exactly as it stands, including its photographs and',
              'data. It is served from Cloudflare, not from apolithomata.com, and is',
              'marked `noindex`.',
            ].join('\n');

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
