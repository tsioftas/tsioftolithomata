# Puts a one-tap "look at this branch" link on every pull request. Closes #179.
#
# The link opens a codespace on the pull request's branch. The dev container
# (.devcontainer/) serves the checkout on port 8000 and makes the forwarded port
# public, so what comes back is a real deployment of the branch — its own images,
# its own data, on a URL that works from a phone.
#
# Deliberately not a static preview committed somewhere. GitHub Pages serves one
# site per repository and this repository's is production, so a committed preview
# would have to live in master's history forever, and it could not carry the
# photographs a branch adds without carrying all 2.4 GB of them. A codespace has
# the whole branch on disk, costs nothing until it is opened, and leaves no trace.
#
# What this workflow does *not* do is create the codespace. That needs a personal
# access token (codespaces bill to a user, so GITHUB_TOKEN cannot), and a codespace
# stops itself after 30 minutes idle, which is not something to hand out as a
# link. Creating it is one tap; keeping it running is not this workflow's business.

name: PR preview

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const {owner, repo} = context.repo;
            const url = `https://codespaces.new/${owner}/${repo}/tree/${branch}`;
            const marker = '<!-- pr-preview -->';

            const body = [
              marker,
              `### [▶ Open this branch in a codespace](${url})`,
              '',
              'Serves this branch on a public URL you can open from a phone. Give it a',
              'minute — the repository is large — then use the **Ports** tab, port 8000.',
              '',
              'It is the whole branch, so photographs and data added here show up. The',
              'codespace stops itself after 30 minutes idle and costs nothing when stopped;',
              'delete it from [your codespaces](https://github.com/codespaces) when done.',
            ].join('\n');

            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.data.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
