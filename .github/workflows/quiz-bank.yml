# Every taxon and locality needs its own quiz questions.

name: Quiz bank

on:
  pull_request:
    branches: [master]
    paths:
      - jsondata/quiz/**
      - jsondata/taxonomy.json
      - jsondata/samples_info.json
      - jsondata/languages.json
      - pyscripts/check_quiz_bank.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pyscripts.check_quiz_bank
