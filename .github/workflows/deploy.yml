# Publishes master to Cloudflare Pages production. The site is too big for
# GitHub Pages' 1 GB limit; pr-preview.yml deploys the same tree per branch.

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never cancel midway: production is what is being replaced.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The sitemap dates each page from the history of the data behind it, so the
      # commits have to be here. blob:none keeps that from meaning a 3.5 GB clone:
      # the file contents are fetched on demand, and only three small JSON files
      # are ever read back through history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyscripts/requirements.txt

      - name: Generate the site
        run: |
          pip install -r pyscripts/requirements.txt
          python -m pyscripts.site_generator.generate_site

      - name: Assemble what gets served
        run: |
          set -euo pipefail
          # Everything the site is made of, and nothing that builds it.
          mkdir -p dist
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.devcontainer' \
            --exclude '.vscode' \
            --exclude 'pyscripts' \
            --exclude 'dist' \
            ./ dist/

          echo "Deploying $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch must match the production branch, or this is a preview.
          command: >-
            pages deploy dist
            --project-name=apolithomata
            --branch=master
            --commit-hash=${{ github.sha }}
