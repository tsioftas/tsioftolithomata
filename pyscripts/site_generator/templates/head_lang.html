<!-- Language metadata, included by every per-language page. Generated from the same
     mapping as the sitemap's hreflang annotations and the switcher menu, so the three
     cannot drift apart. See chrome_context() in pyscripts/site_generator/__init__.py. -->
{% if page_period_color -%}
<!-- The accent for this page is the ICS colour of the period its specimens come
     from, so an accent on this site always means "when". Pages whose specimens
     span more than one period keep the neutral accent. -->
<style>:root { --period: {{page_period_color}}; }</style>
{% endif -%}
{% if page_noindex -%}
<!-- This language is still marked partial in jsondata/languages.json, so its pages
     render the untranslated marker. Built, linked from the switcher, but kept out of
     search results until the translation is finished. -->
<meta name="robots" content="noindex, follow">
{% endif -%}
{% if canonical_url -%}
<link rel="canonical" href="{{canonical_url}}">
{% for alt in indexable_alternates -%}
<link rel="alternate" hreflang="{{alt.lang}}" href="{{alt.abs_href}}">
{% endfor -%}
<link rel="alternate" hreflang="x-default" href="{{xdefault_url}}">
<!-- No automatic redirect to a remembered language. The URL alone decides what this
     page is in, which is what makes a link mean the same thing for whoever it is sent
     to, and it is also what Google asks for: redirecting by stored preference hides the
     other versions from the crawler, defeating the point of the annotations above. The
     switcher in the header is how a reader changes language. -->
{% endif -%}
