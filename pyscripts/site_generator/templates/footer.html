<!-- Included into every generated page by the site generator; see templates/header.html
     for why the labels are rendered rather than fetched. -->
<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <a class="brand" href="{{page_prefix or './'}}" data-doc-path="">
                {% include "icon_brand.html" %}
                <span class="brand-name" data-chrome-key="site-name">{{chrome.site_name}}</span>
            </a>
            <p class="footer-tagline" data-chrome-key="site-tagline">{{chrome.site_tagline}}</p>
        </div>

        <nav class="footer-col" aria-label="{{chrome.site_name}}">
            <a href="{{root_relative_prefix}}gallery"><span data-chrome-key="έκθεση">{{chrome.gallery}}</span></a>
            <a href="{{root_relative_prefix}}map"><span data-chrome-key="map">{{chrome.map}}</span></a>
            <button type="button" onclick="toggleSidebar()"><span data-chrome-key="tree-of-life">{{chrome.tree_of_life}}</span></button>
            <a href="{{page_prefix}}journal/" data-doc-path="journal/"><span data-chrome-key="journal">{{chrome.journal}}</span></a>
            <a href="{{root_relative_prefix}}quiz"><span data-chrome-key="quiz">{{chrome.quiz}}</span></a>
        </nav>

        <div class="footer-col">
            <a id="footer-credits-link" href="{{page_prefix}}acknowledgements" data-doc-path="acknowledgements"><span id="footer-credits">{{chrome.footer_credits}}</span></a>
            <a id="footer-cookies-link" href="{{page_prefix}}cookies" data-doc-path="cookies"><span id="footer-cookies">{{chrome.footer_cookies}}</span></a>
            <a class="repo-link" href="https://github.com/tsioftas/tsioftolithomata" target="_blank" rel="noopener">
                <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor"
                        d="M12 .5C5.73.5.98 5.25.98 11.52c0 5.02 3.26 9.27 7.79 10.77.57.1.78-.25.78-.55
                            0-.27-.01-1.17-.02-2.12-3.17.69-3.84-1.53-3.84-1.53-.52-1.31-1.27-1.66-1.27-1.66
                            -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96
                            .1-.74.4-1.25.72-1.54-2.53-.29-5.2-1.26-5.2-5.62 0-1.24.44-2.25 1.17-3.05
                            -.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.15 1.16a10.9 10.9 0 0 1 5.74 0
                            C17.9 4.2 18.86 4.5 18.86 4.5c.62 1.57.23 2.73.11 3.02.73.8 1.17 1.81 1.17 3.05
                            0 4.37-2.67 5.33-5.21 5.61.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.11
                            0 .3.2.65.79.54 4.53-1.5 7.78-5.75 7.78-10.77C23.02 5.25 18.27.5 12 .5z"/>
                </svg>
                <span id="footer-source">{{chrome.footer_source}}</span>
            </a>
        </div>
    </div>

    <div class="footer-base">
        <a class="footer-author" href="mailto:panaevri@gmail.com"><span id="footer-name">{{chrome.footer_name}}</span></a>
    </div>
</footer>
