<!DOCTYPE html>
<html lang="en" data-prerendered-lang="en" data-default-lang="en"
      data-site-root="./">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Test your knowledge of the fossil collection: identify taxa from silhouettes, guess geological periods and localities, find closest relatives.">
    <title id="quiz-title">Taxonomy quiz</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- Language metadata, included by every per-language page. Generated from the same
     mapping as the sitemap's hreflang annotations and the switcher menu, so the three
     cannot drift apart. See chrome_context() in pyscripts/site_generator/__init__.py. -->
<!-- Applied before the first paint so a reader who chose the dark palette never
     sees a flash of parchment. Light is the default: the site does not follow
     prefers-color-scheme, the reader asks for dark from the menu. -->
<script>try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>

</head>
<body>
    <!-- Included into every generated page by the site generator (see chrome_context in
     pyscripts/site_generator/generate_site.py). Labels are rendered in DEFAULT_LANG so
     the header is complete in the first paint; scripts/language.js rewrites them only
     when the visitor reads in another language. -->
<div id="header-container">
    <header>
        <div class="header-top" id="header-top">
            <button onclick="toggleSidebar()" class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu" aria-expanded="false">
                <span class="hamburger-bars"></span>
            </button>

            <!-- data-doc-path names the page this links to, independent of language, so
                 that on a page whose language is a preference rather than a URL (the
                 quiz, the map, the shells) language.js can repoint it at the reader's
                 language. On a per-language document the rendered href is already right
                 and nothing touches it. -->
            <a id="home-btn" class="home-icon-btn" href="index.html" data-doc-path="index.html" aria-label="Home" title="Home">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M12 3.172 2.5 11.5l1.32 1.5L5 11.96V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8.04l1.18 1.04L21.5 11.5 12 3.172z"/></svg>
            </a>

            <div id="search-container">
                <input type="text" id="search-input" placeholder="Search" autocomplete="off" />
                <ul id="search-results"></ul>
            </div>

            <div class="lang-dropdown">
                <button id="language-toggle"><img src="images/flags/UK_thumb.png" width="20" alt="English"> English &#9660;</button>
                <!-- On a per-language page each language is a real URL, so the switcher
                     is a list of links rather than a repaint, built from the same
                     alternates declared in <head>. The gallery and journal shells have
                     no alternates and still switch client-side, so their menu is left
                     for language.js to fill. -->
                <ul id="language-menu" style="z-index: 9999;">
                </ul>
            </div>
        </div>

        <nav class="breadcrumbs" id="navpath" style="display: none;">
        </nav>
    </header>
</div>

<div id="sidebar-overlay" class="overlay hidden" onclick="closeSidebar()"></div>
<div id="sidebar" class="sidebar collapsed">
  <nav class="drawer-nav">
    <!-- The map and the quiz hold state (filters, progress) that a navigation would
         discard, so they keep a single URL at the site root and switch in place. The
         journal is a document like any other and lives inside the language mirror. -->
    <a id="map-btn" href="map.html"><!-- Drawer icons are inline SVG rather than emoji: emoji render differently on
     every operating system, are missing outright on some, and are read aloud by
     screen readers as their own names ("globe showing Europe-Africa"). -->
<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4.5 3.5 6.8v12.7L9 17.2l6 2.3 5.5-2.3V4.5L15 6.8z"/><path d="M9 4.5v12.7M15 6.8v12.7"/></svg>
<span>Map</span></a>
    <a id="journal-btn" href="journal/index.html" data-doc-path="journal/index.html"><svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3.6h11.5L20 7.1V20.4H5z"/><path d="M8.4 9.2h8.2M8.4 12.6h8.2M8.4 16h5.2"/></svg>
<span>Journal</span></a>
    <a id="quiz-btn" href="quiz.html"><svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.6"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.5"/><path d="M12 16.7h.01"/></svg>
<span>Quiz</span></a>

    <button type="button" id="theme-toggle" class="drawer-theme" aria-pressed="false"
            data-label-dark="Dark theme" data-label-light="Light theme">
      <!-- Half-filled disc: the same mark whichever palette is active, so the control
     reads as "palette" rather than promising a particular destination. -->
<svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/></svg>
<span id="theme-toggle-label">Dark theme</span>
    </button>
  </nav>

  <div class="drawer-tree">
    <h3 id="drawer-tree-heading"><svg class="drawer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V4"/><path d="M4 7.5h6.5V4M4 13h6.5M4 18.5h6.5V21"/><circle cx="13.6" cy="4" r="2.4"/><circle cx="13.6" cy="13" r="2.4"/><circle cx="13.6" cy="21" r="2.4"/></svg>
<span>Tree of Life</span></h3>
    <div id="tree-container"></div>
  </div>
</div>


    <div class="main-section-wrapper">
        <main>
            <section class="quiz-page">

                <div id="quiz-intro-screen" class="quiz-card">
                    <h1 id="quiz-page-heading">Taxonomy quiz</h1>
                    <p id="quiz-intro">Test your knowledge with 10 random questions drawn from the collection.</p>
                    <button id="quiz-start" class="quiz-primary-btn">Start</button>
                </div>

                <div id="quiz-game-screen" class="quiz-card" style="display:none;">
                    <div class="quiz-progress-bar">
                        <span id="quiz-progress-label"></span>
                        <span class="quiz-score-display">
                            <span id="quiz-score">Score</span>: <strong id="quiz-score-value">0</strong>
                        </span>
                    </div>

                    <p id="quiz-prompt" class="quiz-prompt"></p>

                    <div id="quiz-media" class="quiz-media"></div>

                    <div id="quiz-choices" class="quiz-choices"></div>

                    <div id="quiz-feedback" class="quiz-feedback"></div>

                    <div class="quiz-actions">
                        <button id="quiz-hint" class="quiz-secondary-btn" style="display:none;">Hint</button>
                        <button id="quiz-next" class="quiz-primary-btn" style="display:none;">Next</button>
                    </div>
                </div>

                <div id="quiz-end-screen" class="quiz-card" style="display:none;">
                    <h1 id="quiz-round-end">Round complete</h1>
                    <p class="quiz-final-score-display">
                        <span id="quiz-final-score">Final score</span>: <strong id="quiz-final-score-value">0</strong>
                    </p>
                    <button id="quiz-play-again" class="quiz-primary-btn">Play again</button>
                </div>

            </section>
        </main>
    </div>

    <div id="footer-container"><!-- Included into every generated page by the site generator; see templates/header.html
     for why the labels are rendered rather than fetched. -->
<footer>
    <a href="mailto:panaevri@gmail.com"
    class="footer-link"
    >
        <p id="footer-name">Evripidis Papaevripidis</p>
    </a>

    <span class="footer-separator" aria-hidden="true">|</span>

    <a href="https://github.com/tsioftas/tsioftolithomata"
    class="footer-link repo-link"
    target="_blank"
    rel="noopener"
    aria-label="GitHub repository"
    >
        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor"
                d="M12 .5C5.73.5.98 5.25.98 11.52c0 5.02 3.26 9.27 7.79 10.77.57.1.78-.25.78-.55
                    0-.27-.01-1.17-.02-2.12-3.17.69-3.84-1.53-3.84-1.53-.52-1.31-1.27-1.66-1.27-1.66
                    -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96
                    .1-.74.4-1.25.72-1.54-2.53-.29-5.2-1.26-5.2-5.62 0-1.24.44-2.25 1.17-3.05
                    -.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.15 1.16a10.9 10.9 0 0 1 5.74 0
                    C17.9 4.2 18.86 4.5 18.86 4.5c.62 1.57.23 2.73.11 3.02.73.8 1.17 1.81 1.17 3.05
                    0 4.37-2.67 5.33-5.21 5.61.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.11
                    0 .3.2.65.79.54 4.53-1.5 7.78-5.75 7.78-10.77C23.02 5.25 18.27.5 12 .5z"/>
        </svg>

        <span id="footer-source" class="repo-text">Source code</span>
    </a>

    <span class="footer-separator" aria-hidden="true">|</span>

    <a id="footer-credits-link"
    class="footer-link"
    href="acknowledgements.html"
    data-doc-path="acknowledgements.html"
    >
        <span id="footer-credits">Acknowledgements</span>
    </a>

    <span class="footer-separator" aria-hidden="true">|</span>

    <a id="footer-cookies-link"
    class="footer-link"
    href="cookies.html"
    data-doc-path="cookies.html"
    >
        <span id="footer-cookies">Cookies</span>
    </a>
</footer>
</div>

</body>

<script
    id="language-script"
    src="scripts/language.js"
    dict="/quiz.json"
    keys="quiz-title,quiz-page-heading,quiz-intro,quiz-start,quiz-score,quiz-hint,quiz-next,quiz-round-end,quiz-final-score,quiz-play-again"
    galleryLength="0"
></script>

<script src="scripts/sidebar.js"></script>
<script src="scripts/search.js"></script>
<script src="scripts/analytics.js"></script>
<script src="scripts/footer.js"></script>
<script src="scripts/share.js"></script>
<script src="scripts/header.js" id="header-script"></script>
<script src="scripts/quiz.js"></script>

</html>
